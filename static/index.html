<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset Analytics</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #14171c;
      --line: #262b33;
      --text: #e6e8eb;
      --muted: #7d8590;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #e3b341;
      --blue: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 ui-monospace, Consolas, "Cascadia Mono", monospace;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 16px; margin: 0 auto 0 0; letter-spacing: 0.05em; }
    .status {
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
    }
    .status.ok { color: var(--green); border-color: var(--green); }
    .status.bad { color: var(--red); border-color: var(--red); }
    .status.warn { color: var(--yellow); border-color: var(--yellow); }

    table { width: 100%; border-collapse: collapse; background: var(--panel); }
    th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: normal; }
    .table-wrap { overflow-x: auto; }

    td.gap { color: var(--yellow); }     /* VWAP is missing some trades while a gap is filled */
    tr.frozen td { color: var(--muted); } /* numbers aren't live: Binance or the app isn't connected */
    .placeholder { color: var(--muted); font-style: italic; }

    .legend { color: var(--muted); margin: 8px 0 16px; }
    .legend .swatch { color: var(--yellow); }

    details { background: var(--panel); border: 1px solid var(--line); }
    summary { padding: 8px 12px; cursor: pointer; color: var(--muted); }
    #console { max-height: 320px; overflow-y: auto; margin: 0; padding: 0 12px 8px; list-style: none; }
    #console li { padding: 2px 0; white-space: pre-wrap; word-break: break-word; }
    #console .time { color: var(--muted); }
    #console .source { color: var(--blue); }
    #console .warning { color: var(--yellow); }
  </style>
</head>
<body>
  <header>
    <h1>ASSET ANALYTICS</h1>
    <span id="app-status" class="status">App: connecting</span>
    <span id="binance-status" class="status">Binance: -</span>
  </header>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Symbol</th><th>Price</th><th>VWAP</th><th>Last trade</th><th>Volume</th><th>Buy/sell pressure</th></tr>
      </thead>
      <tbody id="assets"></tbody> <!-- one row per asset, added by app.js -->
    </table>
  </div>
  <p class="legend">
    <span class="swatch">Yellow VWAP</span>: some trades are still being fetched after a gap; the number is usable but not final.
    Grey numbers: not live (reconnecting, or the app is unreachable).
  </p>

  <details>
    <summary>Debug console (<span id="event-count">0</span> events)<span id="console-status"></span></summary>
    <ol id="console"></ol>
  </details>

  <script src="/static/app.js"></script>
</body>
</html>
